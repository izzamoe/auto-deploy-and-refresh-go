name: CI

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push cancels the stale run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `uses:` is pinned to a full commit SHA (tag in the trailing comment).
# Runs on GitHub-hosted runners (ubuntu-latest); every gate must fail the run when it fails.
jobs:
  # Fast-failing gate: the published /llms.txt is generated from docs/llms/*.md
  # and from the route table extracted out of the Go sources. If either changed
  # without `make llms` being run, the served context is lying about the API and
  # this job fails before the slower jobs burn time.
  llms-txt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify llms.txt is in sync with routes and docs
        run: make llms-check

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # Race detector, -count=1 (see Makefile). Independent of the built UI.
      - name: Test (race)
        run: make test

      - name: Vulnerability scan (govulncheck)
        run: make vuln

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/openapi-types/package-lock.json

      # fe-install: npm ci. fe-typecheck: tsc. fe-test: Vitest.
      # api-types-check: regenerate OpenAPI types and fail on drift.
      - name: Install, typecheck, unit test, API types drift
        run: make fe-install fe-typecheck fe-test api-types-check

  e2e:
    needs: [go, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/openapi-types/package-lock.json

      # Builds the UI and the single Go binary the browser tests run against.
      - name: Build
        run: make build

      # Chromium and its OS libraries come from the workflow (GitHub-hosted runners have sudo).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 002 (T087, RV-11/RV2-15): the realtime project runs here too, without its p95 latency
      # block (measured locally: a shared 2-vCPU runner makes a timing threshold flaky).
      - name: Playwright smoke, accessibility and realtime
        run: npx playwright test --project=smoke --project=a11y --project=realtime --grep-invert "latency"

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
