name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` is pinned to a full commit SHA (tag in the trailing comment).
# Runners are the self-hosted Linux x64 pool; every gate must fail the run when it fails.
jobs:
  build-release:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    outputs:
      asset_amd64: ${{ steps.contract.outputs.asset_amd64 }}
      asset_arm64: ${{ steps.contract.outputs.asset_arm64 }}
      binary_name: ${{ steps.contract.outputs.binary_name }}
      tag_glob: ${{ steps.contract.outputs.tag_glob }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load release contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          source ./release-contract.sh
          {
            echo "asset_amd64=${AUTO_DEPLOY_ASSET_AMD64}"
            echo "asset_arm64=${AUTO_DEPLOY_ASSET_ARM64}"
            echo "binary_name=${AUTO_DEPLOY_BINARY_NAME}"
            echo "tag_glob=${AUTO_DEPLOY_TAG_GLOB}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # `make release` builds the admin UI first, so Node is required here.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/openapi-types/package-lock.json

      - name: Pre-publish validation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            case "${GITHUB_REF_NAME}" in
              ${{ steps.contract.outputs.tag_glob }}) ;;
              *)
                echo "::error::Tag ${GITHUB_REF_NAME} does not match ${{ steps.contract.outputs.tag_glob }}"
                exit 1
                ;;
            esac
            echo "Validated publish-capable tag ${GITHUB_REF_NAME}."
          else
            echo "Manual dispatch runs validation and packaging only; publish job remains disabled by default."
          fi

      - name: Verify llms.txt is in sync with routes and docs
        run: make llms-check

      - name: Run tests
        run: make test

      - name: Vulnerability scan (govulncheck)
        run: make vuln

      # VERSION is stamped into the binary via -ldflags, so the /llms.txt served
      # by the released build reports the tag it was cut from. On workflow_dispatch
      # GITHUB_REF_NAME is a branch, so fall back to `git describe`.
      - name: Build release archives
        run: |
          make clean
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            make release VERSION="${GITHUB_REF_NAME}"
          else
            make release
          fi

      - name: Validate packaged release assets
        env:
          AUTO_DEPLOY_ASSET_AMD64: ${{ steps.contract.outputs.asset_amd64 }}
          AUTO_DEPLOY_ASSET_ARM64: ${{ steps.contract.outputs.asset_arm64 }}
          AUTO_DEPLOY_BINARY_NAME: ${{ steps.contract.outputs.binary_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import zipfile
          from pathlib import Path

          release_dir = Path("dist/release")
          expected = sorted([
              os.environ["AUTO_DEPLOY_ASSET_AMD64"],
              os.environ["AUTO_DEPLOY_ASSET_ARM64"],
          ])
          actual = sorted(path.name for path in release_dir.glob("*.zip"))

          if actual != expected:
              print(f"expected release assets {expected}, found {actual}", file=sys.stderr)
              raise SystemExit(1)

          for asset in expected:
              archive_path = release_dir / asset
              with zipfile.ZipFile(archive_path) as archive:
                  names = archive.namelist()
                  if names != [os.environ["AUTO_DEPLOY_BINARY_NAME"]]:
                      print(
                          f"{asset} must contain only {os.environ['AUTO_DEPLOY_BINARY_NAME']}, found {names}",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)

          print("Validated release archive names and contents.")
          PY

      # Q-22: publish SHA256SUMS next to the archives (no signature). install.sh
      # and `auto-deploy upgrade` verify downloads against this file.
      - name: Generate SHA256SUMS
        working-directory: dist/release
        shell: bash
        run: |
          set -euo pipefail
          # install.sh is a release asset too, so `auto-deploy upgrade` can verify the
          # script it runs against the same file (FR-046).
          cp ../../install.sh install.sh
          sha256sum -- *.zip install.sh > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Upload release archives for publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: |
            dist/release/${{ steps.contract.outputs.asset_amd64 }}
            dist/release/${{ steps.contract.outputs.asset_arm64 }}
            dist/release/SHA256SUMS
            dist/release/install.sh
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push'
    needs: build-release
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract tag annotation as release body
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The release body is the annotated tag's own message (the text passed
          # to `git tag -a -m`). Without this, action-gh-release ignores the
          # annotation and publishes only the auto-generated changelog, so the
          # description written at tag time is lost.
          message="$(git for-each-ref "refs/tags/${tag}" --format='%(contents)')"
          if [ -z "${message//[[:space:]]/}" ]; then
            echo "::warning::Tag ${tag} has no annotation; using generated notes only."
            : > release-body.md
          else
            printf '%s\n' "${message}" > release-body.md
            echo "Release body taken from ${tag} annotation ($(wc -l < release-body.md) lines)."
          fi

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zips
          path: dist/release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/release/${{ needs.build-release.outputs.asset_amd64 }}
            dist/release/${{ needs.build-release.outputs.asset_arm64 }}
            dist/release/SHA256SUMS
            dist/release/install.sh
          fail_on_unmatched_files: true
          # body_path supplies the tag annotation; generate_release_notes then
          # appends the commit/PR changelog beneath it.
          body_path: release-body.md
          generate_release_notes: true
