# Optional/manual GitHub Actions step to trigger deployment after a successful release build.
# This snippet is not enabled by this repository's release workflow by default.
#
# OPTIONAL MANUAL SETUP — Add these secrets to the repository that will use this snippet:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   DEPLOY_WEBHOOK_SECRET  →  The bearer token for your app
#   DEPLOY_WEBHOOK_URL     →  Your server URL, e.g. http://YOUR_SERVER_IP:9000
#
# NOTE: In multi-app mode, each app has its own unique DEPLOY_WEBHOOK_SECRET.
# The server identifies which app to deploy based on the secret provided.
# Add apps and get their secrets via the admin UI at /admin/apps.
#
# RESPONSE CONTRACT:
#   202 Accepted = deploy queued successfully (always for valid requests)
#   200 OK       = tag already pending/running (duplicate — not re-queued)
#   401 Unauthorized = invalid bearer token
#   400 Bad Request  = missing or empty tag
#   503 Service Unavailable = queue full
#
#   This step passes for any 2xx response.
#
# HOW TO USE:
#   Copy the step below into your own workflow only when you explicitly want
#   that workflow to notify the deploy service. It should run AFTER the release is published.
#   The repository release workflow publishes assets but does not include this step automatically.
#   Add `if: github.event_name == 'release'` if your workflow handles multiple triggers.

- name: Trigger deployment
  if: success()
  run: |
    HTTP_STATUS=$(curl -s -o /tmp/deploy-response.txt -w '%{http_code}' \
      -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}/webhook" \
      -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
      -H "Content-Type: application/json" \
      -d "{\"tag\": \"${{ github.ref_name }}\"}" \
      --connect-timeout 10 \
      --max-time 120)
    echo "Deploy webhook response (HTTP $HTTP_STATUS):"
    cat /tmp/deploy-response.txt
    echo ""
    if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
      echo "::error::Deployment failed with HTTP $HTTP_STATUS"
      exit 1
    fi
    echo "Deployment triggered successfully"
