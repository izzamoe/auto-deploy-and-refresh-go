<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — auto-deploy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111111'/%3E%3Cpath d='M4 8h8M8 4l4 4-4 4' stroke='%23ffffff' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --background: 45 29% 97%;
            --foreground: 240 10% 8%;
            --card: 0 0% 100%;
            --primary: 240 10% 4%;
            --primary-foreground: 0 0% 98%;
            --muted: 40 18% 93%;
            --muted-foreground: 240 4% 42%;
            --accent: 42 92% 56%;
            --destructive: 0 72% 46%;
            --border: 35 16% 84%;
            --ring: 240 10% 8%;
            --radius: 0.625rem;
            --radius-sm: calc(var(--radius) - 0.25rem);
            --radius-md: calc(var(--radius) - 0.125rem);
            --font-family: "Aptos", "Avenir Next", "Gill Sans", sans-serif;
            --shadow-sm: 0 1px 2px hsl(var(--foreground) / 0.04), 0 1px 1px hsl(var(--foreground) / 0.03);
            --shadow-md: 0 12px 28px hsl(var(--foreground) / 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: var(--font-family);
            background: radial-gradient(circle at top left, hsl(var(--accent) / 0.16), transparent 30rem), hsl(var(--background));
            color: hsl(var(--foreground));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            background: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 380px;
            padding: 2rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }
        .brand-dot {
            width: 0.65rem;
            height: 0.65rem;
            border-radius: var(--radius-sm);
            background: hsl(var(--accent));
            box-shadow: 0 0 0 3px hsl(var(--accent) / 0.22);
            flex-shrink: 0;
        }
        .brand-name {
            font-weight: 700;
            font-size: 1.125rem;
            letter-spacing: -0.03em;
            color: hsl(var(--foreground));
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.375rem;
        }
        .subtitle {
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 650;
            margin-bottom: 0.375rem;
            color: hsl(var(--foreground));
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 2.25rem;
            padding: 0 0.625rem;
            font-size: 0.875rem;
            font-family: var(--font-family);
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius-sm);
            background: hsl(var(--card));
            color: hsl(var(--foreground));
            transition: border-color 150ms ease, box-shadow 150ms ease;
            outline: none;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: hsl(var(--ring));
            box-shadow: 0 0 0 3px hsl(var(--ring) / 0.12);
        }
        .btn-submit {
            width: 100%;
            height: 2.25rem;
            margin-top: 1.25rem;
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 650;
            font-family: var(--font-family);
            cursor: pointer;
            transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
            box-shadow: var(--shadow-sm);
        }
        .btn-submit:hover {
            background: hsl(var(--primary) / 0.86);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .error-msg {
            background: hsl(var(--destructive) / 0.10);
            color: hsl(var(--destructive));
            border: 1px solid hsl(var(--destructive) / 0.22);
            border-radius: var(--radius-sm);
            padding: 0.625rem 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">auto-deploy</span>
        </div>

        <h1>Sign in</h1>
        <p class="subtitle">Enter your credentials to access the admin panel.</p>

        {{if .ErrorMessage}}
        <div class="error-msg">{{.ErrorMessage}}</div>
        {{end}}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus
                    value="{{.Username}}"
                />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                />
            </div>
            <button type="submit" class="btn-submit">Sign in</button>
        </form>
    </div>
</body>
</html>
